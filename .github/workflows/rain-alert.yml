name: Feitsui rain alert

on:
  schedule:
    - cron: "*/10 * * * *"        # UTC；GitHub 排程最短 5 分鐘，且尖峰時段可能延遲
  workflow_dispatch:              # 只有具寫入權限的人可手動觸發
    inputs:
      mode:
        description: "once = 正式檢查；dump = 印出原始欄位與計算結果；test-line = 發 LINE 測試訊息"
        type: choice
        options: [once, dump, test-line]
        default: dump

# 注意：不要加入 pull_request / pull_request_target 觸發，避免外部 PR 接觸到 Secrets

permissions:
  contents: read                  # GITHUB_TOKEN 只給唯讀

concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json 只含近 30 小時的公開雨量與「哪一站已通知過」，沒有任何機密
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: rain-state-${{ github.run_id }}
          restore-keys: rain-state-

      - name: Run
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          VERIFY_SSL: ${{ vars.VERIFY_SSL || '1' }}
          RENOTIFY_MINUTES: ${{ vars.RENOTIFY_MINUTES || '180' }}
          RAIN_MODE: ${{ vars.RAIN_MODE || 'hourly' }}
          MODE: ${{ inputs.mode || 'once' }}
        run: python feitsui_rain_alert.py "--$MODE"

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: rain-state-${{ github.run_id }}
